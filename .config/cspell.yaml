---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
caseSensitive: false
import:
  - ~/Workspace/cspell-dicts/cspell.yaml
dictionaryDefinitions:
  - name: project
    path: ./dictionaries/project.txt
    addWords: true
ignorePaths:
  - cspell.yaml
  - /result
  - /.sops.yaml
  - .gitignore
  - flake.lock
  - "**/cue.mod/gen/**"
  - "*.sops.yaml"
  - "*.sops.yml"
  - secret.yaml
  - "*.json"
  - /**/flux-system/*.yaml
dictionaries:
  - project
overrides:
  # cspell has no languageId for .cue, so none of the per-language dictionaries
  # apply and Kubernetes vocabulary is flagged. Treat it as yaml.
  - filename: "**/*.cue"
    languageId: yaml
