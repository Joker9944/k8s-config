policies:
  - type: commit
    spec:
      conventional:
        types:
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
        scopes:
          - cluster # clusters/nyx/
          - infra # cue/infrastructure/
          - apps # cue/apps/
          - schema # cue/schema/ and the render tooling
          - images # images/
          - pkgs # pkgs/
          - okf # .okf/
          - flake # flake.nix, flake.lock, devShell, pre-commit
          - deps # renovate, lockfile
          - skills
        descriptionLength: 72
